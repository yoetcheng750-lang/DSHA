name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37 build-tools;37.0.0'
          accept-android-sdk-licenses: true

      - name: Verify toolchain
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          unzip -l gradle/wrapper/gradle-wrapper.jar | tail -3
          ls -l gradlew

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleStandardDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DSHA-Standard-Debug-APK
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: warn
